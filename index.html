<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lightfarer — Cosmos Prototype</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0a0a0c;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #d8c98c;
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }
  #hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: rgba(216, 201, 140, 0.4);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
    transition: opacity 2s ease;
  }
  #hint.fade {
    opacity: 0;
  }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <!-- Hidden video used as a live source for the portal interior. Muted +
       playsinline so it autoplays everywhere; loops forever. -->
  <video id="portalVideo" src="assets/portal_loop_lapis.mp4" autoplay loop muted playsinline preload="auto" crossorigin="anonymous" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none"></video>
  <div id="hint">click begin · choose your first star</div>
  <script src="start.js?v=20260503c"></script>
  <script src="cosmos.js?v=20260503c"></script>
</body>
</html>
